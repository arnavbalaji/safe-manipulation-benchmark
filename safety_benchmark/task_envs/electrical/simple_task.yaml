scene:
  type: InteractiveTraversableScene
  scene_model: Rs_int
  include_robots: false
  load_task_relevant_only: true

robots:
  - type: Tiago
    obs_modalities: [rgb]
    action_type: continuous
    action_normalize: true
    position: [0.2, 1.0, 0.0]
    orientation: [0, 0, -1, 1]
    grasping_mode: assisted
    damage_params:
      damage_evaluators:
        - mechanical
        - electrical
      health_thresholds: [90.0, 60.0, 30.0]
      mechanical:
        damage_threshold: 10000000000.0
        scale: 1e-10
        instant_coefficient: 1.0
        creep_coefficient: 1.0
        object_type: brittle
        link_thresholds:
          arm:
            damage_threshold: 200.0
            scale: 0.0001
          gripper:
            damage_threshold: 200.0
            scale: 0.0001
      electrical:
        damage_threshold: 0.0
        scale: 0.001
        water_system_name: sludge

objects:
  - type: DatasetObject
    name: breakfast_table
    category: breakfast_table
    model: hggsao
    # model: rjgmmy
    position: [0.0, 0.0, 0.0]
    orientation: [0, 0, 0.7071068, 0.7071068]
    scale: [1.0, 1.0, 1.0]

  - type: DatasetObject
    name: laptop
    category: laptop
    model: nvulcs
    position: [-0.1, 0.15, 0.82]
    orientation: [0, 0, 0.7071068, 0.7071068]
    scale: [0.9, 0.9, 0.9]
    abilities:
      openable: {}
    # fixed_joints: true
    damage_params:
      damage_evaluators:
        - mechanical
        - electrical
      health_thresholds: [90.0, 60.0, 30.0]
      mechanical:
        damage_threshold: 200.0
        scale: 0.1
        instant_coefficient: 1.0
        creep_coefficient: 0.0
        object_type: brittle
      electrical:
        damage_threshold: 100.0
        scale: 1000.0
        water_system_name: water

  - type: DatasetObject
    name: mug
    category: water_glass
    model: vcwsbm
    position: [-0.3, 0.15, 0.82]
    # orientation: [0, 0, 0, 1]
    orientation: [0, 0, 0.7071068, 0.7071068]
    scale: [1.0, 1.0, 1.0]
    damage_params:
      damage_evaluators:
        - mechanical
      health_thresholds: [90.0, 60.0, 30.0]
      mechanical:
        damage_threshold: 200.0
        scale: 0.5
        instant_coefficient: 1.0
        creep_coefficient: 0.0
        object_type: brittle

  - type: DatasetObject
    name: plate
    category: plate
    model: ntedfx
    position: [-0.3, 0.0, 0.82]
    orientation: [0, 0, 0.7071068, 0.7071068]
    scale: [0.6, 0.6, 0.6]

  - type: DatasetObject
    name: furniture_sink_far
    category: furniture_sink
    model: czyfhq
    position: [0.0, 3.0, 0.0]
    orientation: [0, 0, 0.7071068, 0.7071068]
    scale: [1.0, 2.0, 0.6]
    abilities:
      toggleable: {}
      particleSource:
        conditions: {water: []}
        initial_speed: 0.2
      particleSink:
        conditions: {water: []}

