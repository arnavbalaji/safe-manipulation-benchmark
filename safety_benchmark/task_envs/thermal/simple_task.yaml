  #       damage_threshold: 200.0
  #       scale: 0.5
  #       instant_coefficient: 1.0
  #       creep_coefficient: 0.0
  #       object_type: brittle

  - type: DatasetObject
    name: log_left
    category: log
    model: pepele
    # Slightly in front-right inside the fireplace
    position: [0.35, -0.7, 0.2]
    orientation: [0, 0, 0, 1]
    scale: [0.6, 0.6, 0.6]
    abilities:
      flammable: {}
    initial_state:
      onFire: True
    damage_params:
      damage_evaluators:
